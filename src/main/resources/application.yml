# Cấu hình chung (được commit). KHÔNG ghi bí mật vào file này:
# giá trị bí mật đọc từ biến môi trường hoặc application-local.yml (không commit).
spring:
  application:
    name: starshop
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Locale cố định tiếng Việt: JSTL fmt định dạng 550000 -> 550.000 (không phụ thuộc ngôn ngữ trình duyệt)
  web:
    locale: vi_VN
    locale-resolver: fixed

  # View JSP: controller trả về "web/index" -> /WEB-INF/views/web/index.jsp
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  # Datasource đọc từ biến môi trường (có thể ghi đè trong application-local.yml)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/starshop?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # Tắt open-in-view: dữ liệu cho view được chuẩn bị xong ở tầng service (DTO)
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # Gửi email (OTP). Gmail: bật xác minh 2 bước rồi tạo "Mật khẩu ứng dụng" (App password).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  # Upload file: 1 file tối đa 30MB (video), 1 request tối đa 60MB (ví dụ đánh giá: 5 ảnh x 5MB + 1 video 30MB).
  # Giới hạn chi tiết theo loại file (ảnh 5MB, video 30MB) kiểm tra trong FileStorageService.
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 60MB
      file-size-threshold: 2MB

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      # Không gắn ;jsessionid vào URL (c:url), chỉ dùng cookie
      tracking-modes: cookie
  tomcat:
    # Cho Tomcat đọc hết request quá dung lượng để trả về trang lỗi thay vì ngắt kết nối
    max-swallow-size: 100MB

# JWT lưu trong cookie HttpOnly ACCESS_TOKEN. JWT_SECRET: chuỗi ngẫu nhiên >= 32 ký tự, KHÔNG commit.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:8h}
  # Đặt true khi chạy HTTPS
  cookie-secure: ${JWT_COOKIE_SECURE:false}

app:
  mail:
    from: ${MAIL_FROM:}
    from-name: StarShop
    # Chỉ bật khi dev: chưa cấu hình SMTP thì in mã OTP ra log
    dev-log-otp: ${MAIL_DEV_LOG_OTP:false}

# Cloudinary: lấy ở Dashboard -> API Keys. Không ghi key thật vào file này.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:starshop}

# VNPAY (sandbox). tmn-code / hash-secret là bí mật: đặt qua biến môi trường hoặc application-local.yml.
# Hướng dẫn lấy tài khoản sandbox: docs/thanh-toan-vnpay.md
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay/return}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
